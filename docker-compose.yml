services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${EXPOSE_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
      COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
      EXPOSE_HOST: ${EXPOSE_HOST:-127.0.0.1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  ollama:
    image: ollama/ollama:0.34.2
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
  comfyui:
    # Image epinglee cu126 (CUDA 12.6) : les images cu130 ne supportent pas
    # Maxwell (GeForce 840M). Pull d'environ 10 Go, a lancer manuellement.
    image: yanwk/comfyui-boot:cu126-slim
    environment:
      CLI_ARGS: ${COMFYUI_CLI_ARGS:-}
    volumes:
      - ./comfyui/storage:/root
      - ./comfyui/models:/root/ComfyUI/models
      - ./comfyui/input:/root/ComfyUI/input
      - ./comfyui/output:/root/ComfyUI/output
      - ./comfyui/workflows:/root/ComfyUI/user/default/workflows
    ports:
      - "127.0.0.1:8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  ollama:
