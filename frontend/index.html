<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orchestrateur IA</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body><main><header><p class="eyebrow">AI ORCHESTRATOR / V3.1</p><h1>Atelier local pour texte et image</h1><p class="lede">Ollama pour la conversation, ComfyUI pour les generations image.</p></header><section class="grid"><aside><h2>Modèles</h2><div id="models"></div><h2>Conversations</h2><button id="new-conversation">Nouvelle conversation</button><div id="conversations"></div></aside><section><div id="messages" class="messages"></div><form id="message-form"><textarea id="content" required placeholder="Écrire un message..."></textarea><button>Envoyer</button></form><div class="image-panel"><h2>Génération image</h2><label>Workflow<select id="image-workflow"></select></label><label>Prompt<textarea id="image-prompt" required placeholder="Décrire l'image..."></textarea></label><div class="image-options"><label>Seed<input id="image-seed" type="number" min="0" placeholder="Aléatoire"></label><label>Steps<input id="image-steps" type="number" min="1" max="100" value="20"></label><label>CFG<input id="image-cfg" type="number" min="0" max="30" step="0.5" value="7"></label></div><button id="generate-image" type="button">Générer l'image</button><p id="image-status" class="lede" role="status"></p><div id="image-results" class="image-results"></div></div></section></div></main><script src="/app.js"></script></body>
</html>
